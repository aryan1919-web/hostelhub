name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck, test, coverage, and build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Add coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e 'const s=require("./coverage/coverage-summary.json").total; console.log(`Lines: ${s.lines.pct}% | Functions: ${s.functions.pct}% | Branches: ${s.branches.pct}% | Statements: ${s.statements.pct}%`);'
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hostelhub-coverage
          path: coverage/
          if-no-files-found: error

      - name: Build application
        run: npm run build

      - name: Upload production build
        uses: actions/upload-artifact@v4
        with:
          name: hostelhub-production-build
          path: build/
          if-no-files-found: error